<svg fill="none" viewBox="0 0 760 270" width="760" height="270" xmlns="http://www.w3.org/2000/svg">
  <style>
    .window { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .title { fill: #8b949e; font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .prompt { fill: #3fb950; font: 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .text { fill: #e6edf3; font: 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .muted { fill: #8b949e; font: 17px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .cursor { fill: #e6edf3; animation: blink 1s steps(1,end) infinite; }
    .line1, .line2, .line3, .line4, .cursor { opacity: 0; animation-fill-mode: forwards; }
    .line1 { animation: appear .01s 0.35s forwards; }
    .line2 { animation: appear .01s 1.25s forwards; }
    .line3 { animation: appear .01s 2.15s forwards; }
    .line4 { animation: appear .01s 3.05s forwards; }
    .cursor { animation: cursorIn .01s 3.55s forwards, blink 1s 3.55s steps(1,end) infinite; }
    @keyframes appear { to { opacity: 1; } }
    @keyframes cursorIn { to { opacity: 1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  </style>

  <rect class="window" x="1" y="1" rx="12" width="758" height="268"/>
  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#27c93f"/>
  <text class="title" x="380" y="27" text-anchor="middle">paul@github: ~</text>

  <g class="line1">
    <text class="prompt" x="28" y="76">$</text>
    <text class="text" x="49" y="76">whoami</text>
    <text class="muted" x="28" y="104">Paul Boyko</text>
  </g>

  <g class="line2">
    <text class="prompt" x="28" y="142">$</text>
    <text class="text" x="49" y="142">focus --current</text>
    <text class="muted" x="28" y="170">software engineering · ML · systems</text>
  </g>

  <g class="line3">
    <text class="prompt" x="28" y="208">$</text>
    <text class="text" x="49" y="208">stack</text>
    <text class="muted" x="28" y="236">Python · C++ · FastAPI · Git</text>
  </g>

  <g class="line4">
    <text class="prompt" x="500" y="236">$</text>
    <text class="text" x="521" y="236">building...</text>
  </g>
  <rect class="cursor" x="635" y="220" width="9" height="20" rx="1"/>
</svg>
