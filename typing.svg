  </g>

  <g clip-path="url(#c3)">
    <text class="accent" x="18" y="121">/</text>
    <text class="line" x="48" y="121">Software Engineering · Machine Learning · Systems</text>
  </g>

  <g clip-path="url(#c4)">
    <text class="accent" x="18" y="163">—</text>
    <text class="line" x="48" y="163">Python / C++ / TypeScript / FastAPI</text>
  </g>

  <g clip-path="url(#c5)">
    <text class="accent" x="18" y="205">/</text>
    <text class="muted" x="48" y="205">building software that can be tested, measured, and improved.</text>
