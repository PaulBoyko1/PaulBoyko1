<svg viewBox="0 0 900 170" width="900" height="170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated introduction">
  <style>
    .main { fill: #1f2328; font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub { fill: #57606a; font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cursor { fill: #57606a; animation: blink .8s steps(1,end) infinite; }
    @media (prefers-color-scheme: dark) {
      .main { fill: #f0f6fc; }
      .sub, .cursor { fill: #8b949e; }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="line1clip">
      <rect x="70" y="18" width="0" height="42">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
          values="0;0;330;330;330;330;330;330;330"
          keyTimes="0;0.04;0.22;0.40;0.55;0.70;0.82;0.94;1" />
      </rect>
    </clipPath>
    <clipPath id="line2clip">
      <rect x="70" y="65" width="0" height="36">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
          values="0;0;0;0;430;430;430;430;430"
          keyTimes="0;0.22;0.25;0.28;0.52;0.70;0.82;0.94;1" />
      </rect>
    </clipPath>
    <clipPath id="line3clip">
      <rect x="70" y="108" width="0" height="36">
        <animate attributeName="width" dur="9s" repeatCount="indefinite"
          values="0;0;0;0;0;0;610;610;610"
          keyTimes="0;0.22;0.40;0.52;0.55;0.58;0.82;0.94;1" />
      </rect>
    </clipPath>
  </defs>

  <text class="main" x="70" y="50" clip-path="url(#line1clip)">Hi, I’m Paul.</text>
  <text class="sub" x="70" y="94" clip-path="url(#line2clip)">Computer Science @ UC Davis</text>
  <text class="sub" x="70" y="137" clip-path="url(#line3clip)">I build software, simulations, and machine-learning systems.</text>

  <rect class="cursor" x="70" y="119" width="3" height="24" rx="1">
    <animate attributeName="x" dur="9s" repeatCount="indefinite"
      values="70;70;400;70;70;500;70;70;680"
      keyTimes="0;0.04;0.22;0.25;0.28;0.52;0.55;0.58;0.82" />
    <animate attributeName="y" dur="9s" repeatCount="indefinite"
      values="25;25;25;72;72;72;115;115;115"
      keyTimes="0;0.04;0.22;0.25;0.28;0.52;0.55;0.58;0.82" />
  </rect>
</svg>
