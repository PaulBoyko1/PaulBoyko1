    <clipPath id="c2"><rect x="18" y="52" width="0" height="36"><animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;0;470;470;470;470;470;470;0" keyTimes="0;0.02;0.10;0.18;0.28;0.38;0.48;0.80;0.96;1"/></rect></clipPath>
    <clipPath id="c3"><rect x="18" y="94" width="0" height="36"><animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;0;0;650;650;650;650;650;0" keyTimes="0;0.02;0.10;0.18;0.28;0.38;0.48;0.80;0.96;1"/></rect></clipPath>
    <clipPath id="c4"><rect x="18" y="136" width="0" height="36"><animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;555;555;555;555;0" keyTimes="0;0.02;0.10;0.18;0.28;0.38;0.48;0.80;0.96;1"/></rect></clipPath>
    <clipPath id="c5"><rect x="18" y="178" width="0" height="40"><animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;0;0;0;0;790;790;790;0" keyTimes="0;0.02;0.10;0.18;0.28;0.38;0.48;0.80;0.96;1"/></rect></clipPath>
  </defs>

  <g clip-path="url(#c1)">
