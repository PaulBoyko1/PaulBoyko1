<svg viewBox="0 0 960 255" width="960" height="255" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paul Boyko — Computer Science at UC Davis">
  <style>
    .primary { fill:#1f2328; font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .line { fill:#3d444d; font:500 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .accent { fill:#0969da; font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .muted { fill:#656d76; font:500 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .cursor { fill:#0969da; animation: blink .55s steps(1,end) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @media (prefers-color-scheme: dark) {
      .primary { fill:#f0f6fc; }
      .line { fill:#c9d1d9; }
      .accent { fill:#58a6ff; }
      .muted { fill:#8b949e; }
      .cursor { fill:#58a6ff; }
    }
  </style>

  <defs>
