<svg viewBox="0 0 960 116" width="960" height="116" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated description of what Paul builds">
  <style>
    .label {
      fill: #656d76;
      font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      letter-spacing: 1.8px;
    }
    .line {
      fill: #1f2328;
      font: 600 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .accent { fill: #0969da; }
    .fallback { display: none; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #8b949e; }
      .line { fill: #f0f6fc; }
      .accent { fill: #58a6ff; }
    }
    @media (prefers-reduced-motion: reduce) {
