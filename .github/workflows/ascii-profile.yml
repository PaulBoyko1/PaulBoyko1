name: Build ASCII profile

on:
  push:
    paths:
      - "tools/generate_ascii.py"
      - ".github/workflows/ascii-profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ASCII SVG
        run: python tools/generate_ascii.py
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii-profile-v5.svg
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Render high-density ASCII profile"
            git push
          fi
